<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>World explorer</title>
</head>
<body>
<form method="post"
action="{{ '/edit/' ~ city_id if city_id else '/add' }}">
    <label for="name">City name</label>
    <input id="name" name="name" value="{{ name }}"
    maxlength="35" required>
    <p><button type="submit">Save city</button></p>
</form>
<p><a href="/">Home</a></p>
</body>
</html>
